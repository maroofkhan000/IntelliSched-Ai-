<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IntelliSched AI">
  <!-- raised key tile in the app's brand blue (same 3D edge as the buttons) -->
  <rect x="0" y="4" width="64" height="60" rx="14" fill="#1b2f94"/>
  <rect x="0" y="0" width="64" height="58" rx="14" fill="#2b4bd9"/>
  <!-- the timetable grid: filled, free and booked slots -->
  <g fill="#ffffff">
    <rect x="12" y="15" width="11" height="9" rx="2.5"/>
    <rect x="26.5" y="15" width="11" height="9" rx="2.5"/>
    <rect x="12" y="27.5" width="11" height="9" rx="2.5" fill-opacity=".45"/>
    <rect x="41" y="27.5" width="11" height="9" rx="2.5"/>
    <rect x="12" y="40" width="11" height="9" rx="2.5"/>
    <rect x="26.5" y="40" width="11" height="9" rx="2.5"/>
    <rect x="41" y="40" width="11" height="9" rx="2.5" fill-opacity=".45"/>
  </g>
  <!-- the slot the scheduler just placed -->
  <rect x="26.5" y="27.5" width="11" height="9" rx="2.5" fill="#ffb627"/>
  <!-- AI spark in the top-right slot -->
  <path fill="#ffb627" d="M46.5 11.5c.9 5 2.5 6.6 7.5 7.5-5 .9-6.6 2.5-7.5 7.5-.9-5-2.5-6.6-7.5-7.5 5-.9 6.6-2.5 7.5-7.5z"/>
</svg>
